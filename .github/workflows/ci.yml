name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  python:
    name: Python governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked test tools
        run: python -m pip install --requirement requirements/dev.lock
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Run unit tests and explicit-stub tests
        run: make unit-test

  scaffold:
    name: Compose and Terraform foundation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Validate Docker Compose
        run: make compose-check
      - name: Validate pinned Terraform configuration
        run: make terraform-check
      - name: Terraform AWS foundation tests
        run: terraform -chdir=infrastructure/terraform test

  data-layer:
    name: Data-layer container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test credentials
        run: |
          umask 077
          {
            echo 'DATABASE_BIND_ADDRESS=127.0.0.1'
            echo 'POSTGRES_DB=sales_lab'
            echo 'POSTGRES_USER=lab_admin'
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            echo 'MONGO_INITDB_ROOT_USERNAME=lab_root'
            printf 'MONGO_INITDB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            echo 'MONGO_DATABASE=migration_lab'
            echo 'MONGO_GLUE_USERNAME=glue_writer'
            printf 'MONGO_GLUE_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } >.env
      - name: Start, verify, and remove the data layer
        run: |
          cleanup() { make local-down RESET_VOLUMES=1 || true; }
          trap cleanup EXIT
          make compose-check
          make local-up
          make local-status
          make local-test
