[project]
name = "aws-glue-postgres-mongodb-lab"
version = "0.0.0"
description = "Disposable AWS Glue 5.1 PostgreSQL-to-MongoDB learning lab"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
